# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Redeploys daily so the LeetCode stats stay current
  schedule:
    - cron: "0 4 * * *"

env:
  LEETCODE_USERNAME: "yburkut"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # LeetCode blocks browser requests (no CORS), so the stats are fetched here.
      # On failure the committed data/leetcode.json is published as it is.
      - name: Fetch LeetCode stats
        continue-on-error: true
        run: |
          jq -n --rawfile q scripts/leetcode.graphql --arg u "$LEETCODE_USERNAME" \
              '{query: $q, variables: {username: $u}}' |
            curl -sf --max-time 30 -X POST https://leetcode.com/graphql \
              -H 'Content-Type: application/json' -H 'Referer: https://leetcode.com' \
              --data @- -o "$RUNNER_TEMP/leetcode.json"
          jq -e '.data.matchedUser' "$RUNNER_TEMP/leetcode.json" > /dev/null
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {fetchedAt: $t}' \
            "$RUNNER_TEMP/leetcode.json" > data/leetcode.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
